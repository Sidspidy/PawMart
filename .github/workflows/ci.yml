name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check — server
        run: npm run type-check --workspace=server

      - name: Type check — web
        run: npm run type-check --workspace=web

      - name: Type check — admin
        run: npm run type-check --workspace=admin

      - name: Type check — shared
        run: npm run type-check --workspace=@pawmart/shared

  test:
    name: Server Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/pawmart_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-key-at-least-32-characters
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32chars
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      SMTP_USER: test@test.com
      SMTP_PASS: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        run: npm test --workspace=server

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [type-check]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build server
        run: npm run build --workspace=server

      - name: Build web
        env:
          VITE_API_URL: https://api.pawmart.com
        run: npm run build --workspace=web

      - name: Build admin
        env:
          VITE_API_URL: https://api.pawmart.com
        run: npm run build --workspace=admin
